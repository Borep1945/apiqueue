[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "apiqueue"
version = "0.1.0"
description = "Bounded async HTTP batches with rate limits and explicit retry policy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Borep1945"}]
dependencies = ['httpx>=0.27,<1']
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "build>=1.2,<2", "pip-audit>=2.10.1,<3"]

[project.scripts]
apiqueue = "apiqueue.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apiqueue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
