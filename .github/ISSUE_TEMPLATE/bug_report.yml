name: Bug report
description: Report reproducible unexpected behavior
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal command or example without private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, OS, apiqueue version
